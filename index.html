<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>전기회로 시뮬레이터 — MNA 회로 해석 · 전자 이동 · 수로 비유 3D</title>

  <!-- ════════════════════════════════════════════════════════════════
       문서 정보 (검색 결과 · 링크 미리보기 · 브라우저 탭)
         canonical/og:url 은 절대 URL 이어야 미리보기가 동작한다.
       ════════════════════════════════════════════════════════════════ -->
  <meta name="description" content="격자에 소자를 놓고 도선으로 이으면 MNA(수정 노드 해석)로 회로를 풀어 노드 전위·소자 전압·지로 전류를 실시간 계산하는 웹 전기회로 시뮬레이터. DC·AC 해석, 전자 이동 애니메이션, 수로 비유 3D, 과도 응답 그래프를 제공하며 수능 물리 문항 작도 규격의 PNG 선화로 내보냅니다.">
  <meta name="keywords" content="전기회로 시뮬레이터,회로 해석,MNA,수정 노드 해석,키르히호프,RC,RL,RLC,과도 응답,교류 회로,페이저,전자 이동,수능 물리,물리 교육,회로도 그리기">
  <meta name="author" content="양세훈">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="color-scheme" content="light">
  <link rel="canonical" href="https://shy.ai.kr/circuit_simulation/">

  <!-- 파비콘 · 홈 화면 아이콘 -->
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="전기회로">

  <!-- Open Graph (카카오톡·페이스북 등 링크 미리보기) -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="전기회로 시뮬레이터">
  <meta property="og:title"       content="전기회로 시뮬레이터">
  <meta property="og:description" content="소자를 배치하고 도선으로 이으면 MNA 로 회로를 풀어 전위·전압·전류를 실시간 계산합니다. DC·AC 해석, 전자 이동 애니메이션, 수로 비유 3D, 과도 응답 그래프, 수능 규격 PNG 내보내기.">
  <meta property="og:url"         content="https://shy.ai.kr/circuit_simulation/">
  <meta property="og:image"       content="https://shy.ai.kr/circuit_simulation/assets/og-image.png">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale"      content="ko_KR">

  <!-- Twitter/X 카드 -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="전기회로 시뮬레이터">
  <meta name="twitter:description" content="MNA 회로 해석 · 전자 이동 애니메이션 · 수로 비유 3D · 과도 응답 그래프. 수능 물리 문항 작도 규격 PNG 내보내기.">
  <meta name="twitter:image"       content="https://shy.ai.kr/circuit_simulation/assets/og-image.png">

  <!-- 외부 라이브러리: KaTeX (수식 렌더링) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

  <!-- 외부 라이브러리: Three.js (3D 렌더링) + Cannon-es (물리 엔진) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module">
    /* Cannon-es 물리 엔진을 전역(window.CANNON)으로 노출.
       모듈 import 방식이라 http(s)로 게시한 환경에서 동작한다.
       로컬 file:// 더블클릭 시엔 로드되지 않을 수 있으며,
       그 경우 AnalogyRenderer가 동일한 적분식으로 자동 폴백한다. */
    import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';
    window.CANNON = CANNON;
  </script>

  <!-- ════════════════════════════════════════════════════════════════
       스타일시트 (src/styles/)
         링크 순서 = 캐스케이드 순서. responsive 는 항상 마지막이어야
         @media 오버라이드가 올바르게 적용된다.
       ════════════════════════════════════════════════════════════════ -->
  <link rel="stylesheet" href="src/styles/tokens.css">                            <!-- 디자인 토큰 (CSS Custom Properties) -->
  <link rel="stylesheet" href="src/styles/base.css">                              <!-- 리셋 & 기본 레이아웃 -->
  <link rel="stylesheet" href="src/styles/sidebar.css">                           <!-- 사이드바 (소자 팔레트) -->
  <link rel="stylesheet" href="src/styles/canvas.css">                            <!-- 캔버스 레이어 · 드래그 고스트 · 삭제 존 -->
  <link rel="stylesheet" href="src/styles/mode-bar.css">                          <!-- 모드 바 (편집/실행/비유/촬영) -->
  <link rel="stylesheet" href="src/styles/toolbar.css">                           <!-- Undo/Redo · 표시 토글 바 -->
  <link rel="stylesheet" href="src/styles/prop-panel.css">                        <!-- 속성 패널 -->
  <link rel="stylesheet" href="src/styles/transient-panel.css">                   <!-- 과도 응답 그래프 패널 -->
  <link rel="stylesheet" href="src/styles/val-popup.css">                         <!-- 값 입력 팝업 -->
  <link rel="stylesheet" href="src/styles/context-menu.css">                      <!-- 컨텍스트 메뉴 (우클릭) -->
  <link rel="stylesheet" href="src/styles/overlays.css">                          <!-- 토스트 · 연결 힌트 · 정보 오버레이 -->
  <link rel="stylesheet" href="src/styles/responsive.css">                        <!-- 반응형 (모바일 ≤480px / 데스크톱 ≥481px) -->
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════
     모바일 전용 컨트롤 (데스크톱에서는 CSS로 숨김)
     ════════════════════════════════════════════════════════════════ -->
<div id="sidebar-overlay"></div>                              <!-- 사이드바 배경 딤 -->
<button id="hamburger-btn" aria-label="메뉴 열기">             <!-- 사이드바 토글 -->
  <span></span><span></span><span></span>
</button>
<button id="mobile-info-btn" aria-label="속성 보기">ℹ</button>  <!-- 속성 패널 토글 -->
<button id="mobile-graph-btn" aria-label="그래프 보기">📈</button> <!-- 그래프 토글 -->

<!-- ════════════════════════════════════════════════════════════════
     사이드바 (소자 팔레트) — 내용은 JS(Main)가 동적 생성
     ════════════════════════════════════════════════════════════════ -->
<div id="sidebar"></div>

<!-- ════════════════════════════════════════════════════════════════
     캔버스 영역 — 3겹 레이어 + 오버레이 컨트롤
     ════════════════════════════════════════════════════════════════ -->
<div id="canvas-container">
  <!-- 렌더링 레이어 (z-index: bg < main < anim) -->
  <canvas id="canvas-bg"></canvas>     <!-- 격자 배경 (1회 렌더) -->
  <canvas id="canvas-main"></canvas>   <!-- 소자·도선 (편집/실행/비유) -->
  <canvas id="canvas-anim"></canvas>   <!-- 전자 애니메이션 -->

  <!-- 드래그 삭제 존 -->
  <div id="delete-zone">
    <span class="dz-icon">🗑</span>
    <span class="dz-label">삭제</span>
  </div>

  <!-- 모드 전환 바 -->
  <div id="mode-bar">
    <button class="mode-btn active" data-mode="edit">편집</button>
    <button class="mode-btn"        data-mode="run">실행</button>
    <button class="mode-btn"        data-mode="analogy">비유</button>
    <button class="mode-btn"        data-mode="capture">📷촬영</button>
  </div>

  <!-- Undo/Redo + 표시 토글 바 -->
  <div id="undo-bar">
    <button class="undo-btn" id="btn-undo" title="실행 취소 (Ctrl+Z)">↩</button>
    <button class="undo-btn" id="btn-redo" title="다시 실행 (Ctrl+Y)">↪</button>
    <div id="vis-sep"></div>
    <button class="vis-btn"        id="vis-arrows" title="전류 방향 화살표 표시/숨김">▶</button>
    <button class="vis-btn"        id="vis-badges" title="전류 세기 배지 표시/숨김">A</button>
    <button class="vis-btn active" id="vis-labels" title="소자 특성값 표시/숨김">Ω</button>
  </div>

  <!-- 속성 패널 (소자 선택 시) — 내용은 JS(PropPanel)가 채움 -->
  <div id="prop-panel">
    <div class="pp-title">속성</div>
    <div id="prop-content"></div>
  </div>

  <!-- 연결 힌트 / 정보 오버레이 -->
  <div id="conn-hint"></div>
  <div id="info-overlay"></div>
</div>

<!-- ════════════════════════════════════════════════════════════════
     과도 응답 그래프 패널 (canvas-container 밖 — position:fixed)
     ════════════════════════════════════════════════════════════════ -->
<div id="transient-panel">
  <div class="tp-title">
    <span>과도 응답 그래프</span>
    <span class="tp-close" id="tp-close-btn">✕</span>
  </div>
  <canvas id="transient-canvas" width="352" height="180"></canvas>
  <div id="transient-toggles"></div>   <!-- 소자별 켜기/끄기 토글 -->
  <div id="transient-legend"></div>    <!-- 범례 -->
</div>

<!-- ════════════════════════════════════════════════════════════════
     값 입력 팝업 (소자 더블클릭 시)
     ════════════════════════════════════════════════════════════════ -->
<div id="val-popup">
  <div class="vp-title" id="vp-title">값 입력</div>
  <input type="number" id="vp-input" step="any" min="0">
  <div class="vp-hint">Enter 확인 / Esc 취소</div>
  <div class="vp-btns">
    <button class="vp-ok"     id="vp-ok">확인</button>
    <button class="vp-cancel" id="vp-cancel">취소</button>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════════
     컨텍스트 메뉴 (우클릭)
     ════════════════════════════════════════════════════════════════ -->
<div id="ctx-menu">
  <div class="ctx-item"        id="ctx-rotate"><span class="ctx-icon">↻</span>90° 회전</div>
  <div class="ctx-item"        id="ctx-dup"><span class="ctx-icon">⊕</span>복제</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" id="ctx-delete"><span class="ctx-icon">✕</span>삭제</div>
</div>

<!-- ════════════════════════════════════════════════════════════════
     전역 플로팅 요소
     ════════════════════════════════════════════════════════════════ -->
<canvas id="drag-ghost" width="56" height="56"></canvas>   <!-- 드래그 미리보기 -->
<div id="toast"></div>                                      <!-- 에러 토스트 -->

<!-- ════════════════════════════════════════════════════════════════
     애플리케이션 스크립트 (src/js/)
       · 클래식 스크립트라 선언 순서대로 동기 실행된다. 순서를 바꾸면
         모듈 간 의존(App.* 등록 시점)이 깨지므로 변경 금지.
       · 각 파일은 IIFE 로 감싸져 전역을 오염시키지 않는다.
         (core/constants.js 만 의도적으로 전역 상수를 노출)
     ════════════════════════════════════════════════════════════════ -->
<script src="src/js/core/constants.js"></script>                   <!-- 상수 · 소자 정의 테이블 -->
<script src="src/js/core/namespace.js"></script>                   <!-- 전역 App 네임스페이스 -->
<script src="src/js/core/events.js"></script>                      <!-- 이벤트 버스 -->
<script src="src/js/core/state.js"></script>                       <!-- 상태 저장소 + Undo/Redo -->
<script src="src/js/geometry/geo.js"></script>                     <!-- 좌표 변환 · 포트 · 도선 경로 -->
<script src="src/js/render/svg-shapes.js"></script>                <!-- 수능 지면 규격 토큰 + Canvas→SVG 기록기 -->
<script src="src/js/render/symbols.js"></script>                   <!-- 소자 심볼 드로잉 -->
<script src="src/js/circuit/topology.js"></script>                 <!-- 토폴로지 분석 (Union-Find) -->
<script src="src/js/circuit/solver.js"></script>                   <!-- MNA 회로 해석기 -->
<script src="src/js/render/grid-renderer.js"></script>             <!-- 격자 배경 렌더러 -->
<script src="src/js/render/edit-renderer.js"></script>             <!-- 편집 모드 렌더러 -->
<script src="src/js/render/run-renderer.js"></script>              <!-- 실행 모드 전자 애니메이션 -->
<script src="src/js/render/analogy-renderer.js"></script>          <!-- 수로 비유 모드 (Three.js) -->
<script src="src/js/render/capture.js"></script>                   <!-- SVG 선화 내보내기 (촬영) -->
<script src="src/js/ui/interaction.js"></script>                   <!-- 포인터 제스처 FSM -->
<script src="src/js/ui/transient-graph.js"></script>               <!-- 과도 응답 그래프 -->
<script src="src/js/ui/val-popup.js"></script>                     <!-- 값 입력 팝업 -->
<script src="src/js/ui/prop-panel.js"></script>                    <!-- 속성 패널 -->
<script src="src/js/ui/toast.js"></script>                         <!-- 전역 에러 토스트 -->
<script src="src/js/main.js"></script>                             <!-- 부트스트랩 & 오케스트레이션 -->

</body>
</html>
